<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comunicado Mensal HUB DE SERVIÇOS · Edição 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  =====================================================================
  COMUNICADO MENSAL HUB DE SERVIÇOS — EDIÇÃO 01
  O conteúdo de cada edição fica no bloco <script id="dados-revista">
  lá embaixo. Para uma nova edição, use o arquivo "editor_revista.html".
  =====================================================================
-->
<style>
  :root{
    --red:#CC0000; --red-dk:#9E0000; --red-lt:#FCE8E8;
    --ink:#141414; --paper:#EEEEEE; --white:#FFFFFF; --muted:#5E5E5E; --line:#D6D6D6;
    --gold:#F2B705; --ok:#1F9D55;
    --serif:'DM Serif Display', Georgia, 'Times New Roman', serif;
    --sans:'Inter', 'Segoe UI', Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  /* ---------- barra superior ---------- */
  .topbar{background:var(--ink);color:#fff;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
  .topbar .wrap{display:flex;justify-content:space-between;gap:12px;padding-top:8px;padding-bottom:8px}
  .topbar b{color:var(--gold)}

  /* ---------- cabeçalho (título de jornal) ---------- */
  .masthead{background:#DEDEE0;color:var(--ink);text-align:center;border-top:8px solid var(--ink)}
  .masthead .wrap{padding-top:22px;padding-bottom:6px}
  .masthead .logo{display:block;height:104px;width:auto;margin:0 auto 4px}
  .masthead h1{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:clamp(40px,7.4vw,104px);line-height:1.02;letter-spacing:-.01em;padding-bottom:14px}
  .masthead h1 span:last-child{color:var(--red)}
  .subtitle{background:#DEDEE0;border-top:1px solid var(--ink);border-bottom:4px double var(--ink);margin-bottom:0}
  .subtitle .wrap{text-align:center;padding-top:9px;padding-bottom:9px}
  .subtitle p{font-family:var(--sans);font-weight:700;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}

  /* ---------- menu ---------- */
  nav.menu{position:sticky;top:0;z-index:30;background:var(--white);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.05)}
  nav.menu .wrap{display:flex;flex-wrap:wrap;gap:0 6px;align-items:center}
  nav.menu .wrap::-webkit-scrollbar{display:none}
  nav.menu a{white-space:nowrap;text-decoration:none;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;padding:14px 11px;border-bottom:3px solid transparent}
  nav.menu a:hover,nav.menu a.on{color:var(--red);border-bottom-color:var(--red)}
  nav.menu .brand{font-family:var(--serif);text-transform:none;letter-spacing:0;font-size:20px;font-weight:400;color:var(--red);padding-right:18px}

  /* ---------- faixa de plantão ---------- */
  .ticker{background:var(--ink);color:#fff;display:flex;align-items:center;overflow:hidden;height:44px}
  .ticker .lbl{flex:none;background:var(--red);height:100%;display:flex;align-items:center;gap:8px;padding:0 16px;font-weight:800;font-size:13px;letter-spacing:.12em;z-index:2}
  .ticker .lbl i{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}
  .ticker .track{display:flex;gap:48px;white-space:nowrap;animation:roll 40s linear infinite;padding-left:24px;font-weight:600;font-size:14px}
  .ticker .track span::before{content:'■';color:var(--red);margin-right:12px;font-size:10px;vertical-align:2px}
  .ticker:hover .track{animation-play-state:paused}
  @keyframes roll{to{transform:translateX(-50%)}}

  /* ---------- manchete ---------- */
  .hero{padding:40px 0 20px}
  .hero .grid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
  .hero .pic{background:none;padding:0;box-shadow:none;border:0}
  .hero .pic .cap{font-size:13px;font-style:italic;color:var(--muted);padding:8px 0 0}
  .hero .pic img{width:100%;height:auto;display:block}
  .tag{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;background:var(--red);color:#fff}
  .tag.dark{background:var(--ink)}
  .tag.gold{background:var(--gold);color:var(--ink)}
  .hero h2{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.6vw,58px);line-height:1.02;margin:16px 0 14px}
  .hero .lead{font-size:18px;color:var(--muted);margin-bottom:22px}
  .btn{display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;font-weight:700;padding:13px 22px;border-radius:40px;transition:transform .15s, background .15s;text-decoration:none}
  .btn:hover{background:var(--red-dk);transform:translateY(-2px)}
  .btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:#fff}

  /* ---------- títulos de seção ---------- */
  section.sec{padding:46px 0 10px;scroll-margin-top:60px}
  .sechead{display:flex;flex-direction:column;align-items:flex-start;gap:8px;border-top:6px solid var(--ink);padding-top:12px;margin-bottom:24px}
  .sechead h3{font-family:var(--serif);font-weight:400;color:var(--red);font-size:clamp(34px,5vw,54px);line-height:1}
  .sechead p{color:var(--muted);font-size:16px;max-width:720px;text-align:left}

  /* ---------- stories ---------- */
  .stories{display:flex;gap:22px;overflow-x:auto;padding:6px 2px 14px}
  .story{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;width:108px}
  .story .ring{width:98px;height:98px;border-radius:50%;padding:4px;background:conic-gradient(var(--red),var(--gold),var(--red));transition:transform .2s}
  .story:hover .ring{transform:scale(1.06)}
  .story img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid var(--paper)}
  .story b{font-size:13.5px;text-align:center;line-height:1.2}
  .story small{font-size:11.5px;color:var(--muted);text-align:center;margin-top:-6px}

  /* ---------- números ---------- */
  .numbers{background:var(--red);color:#fff;margin-top:36px}
  .numbers .nhead{padding-top:28px;padding-bottom:0}
  .numbers .nhead h3{font-family:var(--serif);font-weight:400;font-size:clamp(24px,3vw,32px);border-bottom:1px solid rgba(255,255,255,.35);padding-bottom:10px}
  .numbers .ngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;padding-top:20px;padding-bottom:30px}
  .num{text-align:center;padding:10px 12px;border-right:1px solid rgba(255,255,255,.25)}
  .num:last-child{border-right:0}
  .num strong{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(46px,6vw,70px);line-height:1;font-variant-numeric:tabular-nums}
  .num span{display:block;margin-top:6px;font-size:14px;font-weight:600;opacity:.95}
  .faixa{background:var(--white);border-left:6px solid var(--red);box-shadow:0 4px 18px rgba(0,0,0,.07);padding:18px 22px;margin-bottom:22px}
  .faixa h5{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
  .faixa .fgrid{display:flex;flex-wrap:wrap;gap:8px 0}
  .fn{flex:1;min-width:150px;padding:4px 18px 4px 0;margin-right:18px;border-right:1px solid var(--line)}
  .fn:last-child{border-right:0;margin-right:0}
  .fn strong{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(40px,5vw,56px);line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
  .fn span{font-size:14px;color:var(--muted);font-weight:600}
  blockquote.pull{font-family:var(--serif);font-size:20px;line-height:1.3;border-left:5px solid var(--red);background:var(--red-lt);padding:12px 16px;margin:6px 0;color:var(--ink)}
  .hero blockquote.pull{font-size:22px;margin:0 0 22px}
  .txt ul{margin:0 0 14px 22px;font-size:17px}.txt li{margin-bottom:6px}
  .talks{background:var(--ink);color:#fff;padding:30px;margin-top:22px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;border-top:6px solid var(--gold)}
  .talks h4{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,44px);line-height:1.05;margin:12px 0 6px}
  .talks .by{color:var(--gold);font-weight:700;margin-bottom:12px}
  .talks p{color:#d6d6d6}
  .talks .ask{background:var(--red);padding:20px;border-radius:6px}
  .talks .ask q{font-family:var(--serif);font-size:24px;line-height:1.15;display:block;margin-bottom:10px}
  .blocos{margin-top:30px}
  .blocos h4{font-family:var(--serif);font-weight:400;font-size:28px;margin-bottom:14px}
  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
  .bloco{background:var(--white);box-shadow:0 4px 18px rgba(0,0,0,.07);padding:18px 20px;border-top:4px solid var(--red);display:flex;flex-direction:column;gap:8px}
  .bloco b{font-family:var(--serif);font-weight:400;font-size:22px}
  .bloco p{color:var(--muted);font-size:15px}
  .bloco .ctl{margin-top:auto;font-size:13px;background:var(--paper);padding:8px 10px;border-radius:6px}
  .bloco .ctl b{font:700 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--red);display:block}
  @media (max-width:820px){.talks{grid-template-columns:1fr}.num{border-right:0}}

  /* ---------- cards de notícia ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
  .cards > .card:only-child{grid-column:1/-1}
  .cards > .card:only-child:has(.img){flex-direction:row;align-items:stretch}
  .cards > .card:only-child:has(.img) .img{flex:0 0 46%;aspect-ratio:auto;min-height:260px}
  .cards > .card:only-child:has(.img) .body{justify-content:center}
  @media (max-width:820px){.cards > .card:only-child:has(.img){flex-direction:column}.cards > .card:only-child:has(.img) .img{flex:none;aspect-ratio:16/9;min-height:0}}
  .cards > .card:only-child .body{padding:22px 28px}
  .cards > .card:only-child p{font-size:17px}
  .card{background:var(--white);display:flex;flex-direction:column;box-shadow:0 4px 18px rgba(0,0,0,.07);transition:transform .2s, box-shadow .2s}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.12)}
  .card .img{aspect-ratio:16/9;overflow:hidden;background:var(--red-lt)}
  .card .img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .card:hover .img img{transform:scale(1.05)}
  .card .body{padding:18px 20px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card h4{font-family:var(--serif);font-weight:400;font-size:25px;line-height:1.1}
  .card p{color:var(--muted);font-size:15px}
  .txtc p{color:var(--muted);font-size:15px;margin-bottom:10px}
  .cards > .card:only-child .txtc p{font-size:17px}
  .talks .by{color:var(--gold);font-weight:700;margin-bottom:6px}
  .talks h4{font-size:clamp(24px,3vw,34px)}
  .masthead h1.two span{display:block}
  .sec.center .sechead{align-items:center;text-align:center}
  .sec.center .sechead h3{width:100%;text-align:center}
  .centro{max-width:860px;margin:0 auto 10px;background:var(--white);border-top:5px solid var(--red);box-shadow:0 4px 18px rgba(0,0,0,.07);padding:30px 34px;text-align:center}
  .centro p{font-size:17px;color:var(--ink);margin:0 0 14px}
  .centro .links{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;align-items:center;gap:14px}
  .centro .links li{font-size:15px;color:var(--muted);max-width:100%}
  .centro .links span{display:block;font-weight:700;color:var(--ink);margin-bottom:2px}
  .centro .links a{color:var(--red);overflow-wrap:anywhere;word-break:break-all}
  nav.menu a{padding-left:8px;padding-right:8px;letter-spacing:.05em}
  nav.menu .brand{padding-right:12px}
  .links2{list-style:none;margin:6px 0 0;padding:0}
  .links2 li{font-size:15px;color:var(--muted);margin-bottom:10px;overflow-wrap:anywhere}
  .links2 b{color:var(--ink)}
  .links2 a{color:var(--red)}
  .blist{margin:0 0 4px 20px;color:var(--muted);font-size:15px}
  .blist li{margin-bottom:6px}
  .cards:has(> .card:nth-child(2):last-child){grid-template-columns:1fr 1fr}
  @media (max-width:820px){.cards:has(> .card:nth-child(2):last-child){grid-template-columns:1fr}}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12.5px;background:var(--paper);padding:4px 10px;border-radius:20px}
  .chip b{color:var(--red)}
  .card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
  .more{font-weight:700;font-size:14px;color:var(--red)}
  .more:hover{text-decoration:underline}
  .reacts{display:flex;gap:4px}
  .reacts button{font-size:13px;padding:4px 8px;border-radius:20px;background:var(--paper);transition:transform .15s}
  .reacts button:hover{transform:scale(1.12)}
  .reacts button.on{background:var(--red-lt);color:var(--red);font-weight:700}
  .pop{animation:pop .35s}
  @keyframes pop{50%{transform:scale(1.35)}}

  /* ---------- extras de pessoas ---------- */
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
  .box{background:var(--white);padding:22px;box-shadow:0 4px 18px rgba(0,0,0,.07)}
  .box h5{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:14px}
  .medal{display:flex;align-items:center;gap:14px;padding:8px 0}
  .medal .ph{position:relative;flex:none}
  .medal img{width:58px;height:58px;border-radius:50%;object-fit:cover}
  .medal .yr{position:absolute;right:-6px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:var(--gold);border:2px solid #fff;display:grid;place-items:center;font-weight:800;font-size:13px}
  .medal b{display:block;font-size:16px}
  .medal span{font-size:13.5px;color:var(--muted)}
  .bdays{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .bday{background:var(--paper);padding:10px;text-align:center}
  .bday b{display:block;color:var(--red);font-size:18px}
  .bday span{font-size:13px}

  /* ---------- mito ou verdade ---------- */
  .myth{background:var(--ink);color:#fff;padding:34px;margin-top:22px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center}
  .myth q{font-family:var(--serif);font-size:clamp(24px,3vw,34px);line-height:1.15;display:block}
  .myth .opts{display:flex;gap:12px;flex-wrap:wrap}
  .myth .opts button{flex:1;min-width:130px;padding:16px;font-weight:800;letter-spacing:.1em;font-size:16px;border-radius:40px;background:#fff;color:var(--ink);transition:transform .15s}
  .myth .opts button:hover{transform:translateY(-3px)}
  .myth .opts button.m{background:var(--red);color:#fff}
  .myth .ans{display:none;margin-top:16px;padding:16px;border-radius:8px;background:rgba(255,255,255,.08)}
  .myth .ans.show{display:block;animation:fadeup .4s}
  .myth .ans b{font-size:20px}
  @keyframes fadeup{from{opacity:0;transform:translateY(10px)}}

  /* ---------- vídeo ---------- */
  .videosec{background:var(--ink);color:#fff;margin-top:50px;padding:50px 0}
  .videosec .grid{display:grid;grid-template-columns:1fr 1.6fr;gap:34px;align-items:center}
  .videosec h3{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.5vw,52px);line-height:1;margin:12px 0}
  .videosec p{color:#C9C9C9}
  .videosec video,.videosec iframe{width:100%;aspect-ratio:16/9;background:#000;border:6px solid var(--red);display:block}
  .videosec .link{display:grid;place-items:center;aspect-ratio:16/9;border:6px solid var(--red);text-decoration:none;font-weight:700}

  /* ---------- quiz ---------- */
  .quiz{background:var(--white);box-shadow:0 4px 18px rgba(0,0,0,.07);padding:30px;max-width:780px;margin:0 auto}
  .quiz .bar{height:8px;background:var(--paper);border-radius:8px;overflow:hidden;margin-bottom:20px}
  .quiz .bar i{display:block;height:100%;background:var(--red);transition:width .4s}
  .quiz .q{font-family:var(--serif);font-size:clamp(24px,3vw,32px);line-height:1.15;margin-bottom:18px}
  .quiz .op{display:block;width:100%;text-align:left;padding:14px 18px;margin-bottom:10px;border:2px solid var(--line);border-radius:10px;font-size:16px;font-weight:600;transition:border-color .15s, background .15s}
  .quiz .op:hover{border-color:var(--red)}
  .quiz .op.right{border-color:var(--ok);background:#E7F6EE}
  .quiz .op.wrong{border-color:var(--red);background:var(--red-lt)}
  .quiz .res{text-align:center}
  .quiz .res strong{display:block;font-family:var(--serif);font-weight:400;font-size:64px;color:var(--red);line-height:1}
  .quiz .res h4{font-family:var(--serif);font-weight:400;font-size:30px;margin:8px 0}

  /* ---------- enquete ---------- */
  .poll{background:var(--white);box-shadow:0 4px 18px rgba(0,0,0,.07);padding:26px}
  .poll h4{font-family:var(--serif);font-weight:400;font-size:26px;margin-bottom:14px;line-height:1.15}
  .poll .opt{position:relative;display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px;font-weight:600;overflow:hidden}
  .poll .opt:hover{border-color:var(--red)}
  .poll .opt i{position:absolute;inset:0 auto 0 0;background:var(--red-lt);width:0;transition:width .7s;z-index:0}
  .poll .opt span{position:relative;z-index:1;display:flex;justify-content:space-between;gap:10px}
  .poll .opt.mine{border-color:var(--red)}
  .poll small{color:var(--muted)}

  /* ---------- rodapé ---------- */
  footer{background:var(--ink);color:#fff;margin-top:60px;padding:46px 0 30px}
  footer .msg{display:inline-block;background:var(--red);font-family:var(--serif);font-size:26px;padding:6px 18px}
  footer blockquote{font-weight:800;font-size:clamp(20px,2.6vw,28px);margin:16px 0 30px;max-width:900px;line-height:1.3}
  footer .row{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;border-top:1px solid #333;padding-top:22px}
  footer .row p{color:#bbb;font-size:14px}
  footer .row b{color:#fff}

  /* ---------- janela de matéria / stories ---------- */
  .overlay{position:fixed;inset:0;background:rgba(10,10,10,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.open{display:flex;animation:fadein .2s}
  @keyframes fadein{from{opacity:0}}
  .article{background:var(--white);max-width:760px;width:100%;max-height:90vh;overflow:auto;position:relative}
  .article img{width:100%;height:auto;display:block}
  .article .in{padding:26px 30px 34px}
  .article h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4vw,42px);line-height:1.05;margin:12px 0}
  .article .lf{font-size:18px;color:var(--muted);font-style:italic;margin-bottom:18px}
  .article .txt p{margin-bottom:14px;font-size:17px}
  .x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;font-size:22px;line-height:1;z-index:3}
  .storyview{width:100%;max-width:420px;height:min(760px,90vh);background:var(--ink);color:#fff;position:relative;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .storyview .prog{display:flex;gap:4px;padding:12px 12px 0;position:absolute;top:0;left:0;right:0;z-index:3}
  .storyview .prog i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:3px;overflow:hidden}
  .storyview .prog i b{display:block;height:100%;width:0;background:#fff}
  .storyview .ph{height:58%;background-size:cover;background-position:center top;position:relative}
  .storyview .ph::after{content:'';position:absolute;inset:auto 0 0 0;height:50%;background:linear-gradient(transparent,var(--ink))}
  .storyview .tx{padding:0 24px 24px;margin-top:-50px;position:relative;z-index:2}
  .storyview h4{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1}
  .storyview .role{color:var(--gold);font-weight:700;font-size:14px;margin:4px 0 14px}
  .storyview .qq{font-weight:700;font-size:14px;color:#ffb3b3}
  .storyview .aa{font-family:var(--serif);font-size:21px;line-height:1.25;margin:4px 0 12px}
  .storyview .nav{position:absolute;top:0;bottom:0;width:35%;z-index:2}
  .storyview .nav.l{left:0}.storyview .nav.r{right:0}
  .storyview .x{top:22px}

  /* ---------- animação ao rolar ---------- */
  .rv{opacity:0;transform:translateY(24px);transition:opacity .6s ease, transform .6s ease}
  .rv.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){ .rv{opacity:1;transform:none;transition:none} .ticker .track,.masthead .seal{animation:none} html{scroll-behavior:auto} }

  @media (max-width:1120px) and (min-width:821px){ nav.menu a{font-size:11.5px;padding:14px 7px;letter-spacing:.04em} nav.menu .brand{font-size:18px;padding-right:10px} }
  /* ---------- celular ---------- */
  @media (max-width:820px){
    .hero .grid,.videosec .grid,.myth,.duo{grid-template-columns:1fr}
    .hero .pic .cap{padding-left:20px}
    .sechead{flex-direction:column;align-items:flex-start}
    .sechead p{text-align:left}
    nav.menu .wrap{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  }
</style>

<script>
(function(){
  // ---------- ajudantes ----------
  const D = JSON.parse(document.getElementById('dados-revista').textContent);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const paras = s => { const out = []; let list = []; const flush = () => { if (list.length){ out.push('<ul>' + list.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'); list = []; } };
    String(s || '').split(/\n+/).map(x => x.trim()).filter(Boolean).forEach(l => { if (/^[-•]\s+/.test(l)) list.push(l.replace(/^[-•]\s+/, '')); else { flush(); out.push('<p>' + esc(l) + '</p>'); } }); flush(); return out.join(''); };
  const quote = c => c ? '<blockquote class="pull">' + esc(c) + '</blockquote>' : '';
  const SECOES = [
    {id:'editorial', curto:'Editorial', nome:'Direção editorial', desc:''},
    {id:'pessoas', curto:'Pessoas', nome:'Pessoas', desc:''},
    {id:'processos', curto:'Processos', nome:'Processos', desc:''},
    {id:'tecnologia', curto:'Tecnologia', nome:'Tecnologia', desc:''},
    {id:'cobertura', curto:'Cobertura', nome:'Cobertura', desc:''},
    {id:'automacoes', curto:'Automações', nome:'Automações', desc:''},
    {id:'ito', curto:'ITO', nome:'ITO', desc:''},

  const tagClass = t => { t = String(t || '').toUpperCase(); return /EXCLUSIVO|ENTREVISTA/.test(t) ? 'dark' : /NOVIDADE|DICA|VOCÊ SABIA/.test(t) ? 'gold' : ''; };

        </div></header>`;

        ${SECOES.map(s => `<a href="#${s.id}">${s.curto || s.nome}</a>`).join('')}

  if ((D.plantao || []).length){

  }

          </div></div></section>`;

  // números
  if ((D.numeros || []).length){
    h += `<div class="numbers"><div class="wrap nhead"><h3>${esc(D.numerosTitulo || 'Em números')}</h3></div><div class="wrap ngrid">${D.numeros.map(n => `<div class="num rv"><strong data-count="${Number(n.valor) || 0}" data-pre="${esc(n.prefixo)}" data-suf="${esc(n.sufixo)}">${esc(n.prefixo)}0${esc(n.sufixo)}</strong><span>${esc(n.rotulo)}</span></div>`).join('')}</div></div>`;
  }

  const bl = n => (n.texto && /^\s*-\s/.test(n.texto)) ? n.texto.split(/\n+/).map(l => l.trim()).filter(l => /^-\s/.test(l)).map(l => l.replace(/^-\s+/, '')) : [];
  const card = n => `<article class="card rv">
      ${n.foto ? `<div class="img"><img src="${n.foto}" alt=""></div>` : ''}
      <div class="body">
        ${n.etiqueta ? `<div><span class="tag ${tagClass(n.etiqueta)}">${esc(n.etiqueta)}</span></div>` : ''}
        ${n.titulo ? `<h4>${esc(n.titulo)}</h4>` : ''}
        ${n.inline ? `<div class="txtc">${paras(n.texto)}</div>` : bl(n).length ? `<ul class="blist">${bl(n).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : (n.linhaFina ? `<p>${esc(n.linhaFina)}</p>` : '')}
        ${quote(n.citacao)}
        ${(n.info || []).length ? `<div class="chips">${n.info.map(c => `<span class="chip"><b>${esc(c.rotulo)}:</b> ${esc(c.valor)}</span>`).join('')}</div>` : ''}
        <div class="foot">
          ${n.texto && !n.inline && !bl(n).length ? `<button class="more" data-open="n${n._i}">Ler mais →</button>` : '<span></span>'}
        </div>
      </div></article>`;

  // seções
  SECOES.forEach(S => {
    const lista = noticias.filter(n => secId(n.secao) === S.id);
    let inner = '';
    if (S.id === 'pessoas' && (D.novatos || []).length){
      inner += `<p style="font-weight:700;margin-bottom:6px">Destaques da edição <span style="color:var(--muted);font-weight:500">· clique nos cards</span></p>
        <div class="stories">${D.novatos.map((p, i) => `<button class="story" data-story="${i}"><span class="ring"><img src="${p.foto || ''}" alt=""></span><b>${esc(p.nome)}</b><small>${esc(p.cargo)}</small></button>`).join('')}</div>`;
    }
    (D.faixas || []).filter(f => secId(f.secao) === S.id).forEach(f => {
      inner += `<div class="faixa rv">${f.titulo ? `<h5>${esc(f.titulo)}</h5>` : ''}<div class="fgrid">${f.itens.map(i => `<div class="fn"><strong data-count="${Number(i.valor) || 0}" data-pre="" data-suf="">0</strong><span>${esc(i.rotulo)}</span></div>`).join('')}</div></div>`;
    });
    const antes = lista.filter(n => !n.posBlocos), depois = lista.filter(n => n.posBlocos);
    if (antes.length) inner += `<div class="cards">${antes.map(card).join('')}</div>`;
    if (S.id === 'pessoas' && D.talks && D.talks.titulo){
      const T = D.talks;
      inner += `<div class="talks rv"><div><span class="tag gold">${esc(T.etiqueta)}</span><h4>${esc(T.titulo)}</h4>${T.apresentador ? `<div class="by">${esc(T.apresentador)}</div>` : ''}${T.texto ? `<p>${esc(T.texto)}</p>` : ''}</div>
        <div class="ask"><q>${esc(T.pergunta)}</q><span>${esc(T.convite)}</span>${E.emailRedacao ? `<p style="margin-top:12px"><a class="btn ghost" style="color:#fff;border-color:#fff" href="mailto:${esc(E.emailRedacao)}?subject=${encodeURIComponent('GRC Talks · risco da minha rotina')}">✉ Enviar exemplo</a></p>` : ''}</div></div>`;
    }
    if (S.id === 'automacoes' && D.blocos && (D.blocos.itens || []).length){
      inner += `<div class="blocos rv"><h4>${esc(D.blocos.titulo)}</h4><div class="bgrid">${D.blocos.itens.map(b => `<div class="bloco"><b>${esc(b.bloco)}</b><p>${esc(b.conteudo)}</p><div class="ctl"><b>Controle mínimo</b>${esc(b.controle)}</div></div>`).join('')}</div></div>`;
    }
    (D.centrais || []).filter(c => secId(c.secao) === S.id).forEach(c => {
      inner += `<div class="cards"><article class="card rv"><div class="body"><div class="txtc">${(c.paragrafos || []).map(p => `<p>${esc(p)}</p>`).join('')}${(c.links || []).length ? `<ul class="links2">${c.links.map(l => `<li><b>${esc(l.rotulo)}:</b> <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a></li>`).join('')}</ul>` : ''}</div></div></article></div>`;
    });
    if (depois.length) inner += `<div class="cards" style="margin-top:22px">${depois.map(card).join('')}</div>`;
    if (S.id === 'pessoas' && ((D.tempoCasa || []).length || (D.aniversariantes || []).length)){
      inner += `<div class="duo">
        <div class="box rv"><h5>🏅 Tempo de casa</h5>${(D.tempoCasa || []).map(p => `<div class="medal"><div class="ph"><img src="${p.foto || ''}" alt=""><span class="yr">${esc(p.anos)}</span></div><div><b>${esc(p.nome)}</b><span>${esc(p.anos)} ${Number(p.anos) === 1 ? 'ano' : 'anos'} de HITSS</span></div></div>`).join('')}</div>
        <div class="box rv"><h5>🎂 Aniversariantes do mês</h5><div class="bdays">${(D.aniversariantes || []).map(a => `<div class="bday"><b>${esc(a.data)}</b><span>${esc(a.nome)}</span></div>`).join('')}</div></div>
      </div>`;
    }
    if (S.id === 'processos' && D.mito && D.mito.frase){
      inner += `<div class="myth rv"><div><span class="tag">Mito ou verdade?</span><q style="margin-top:14px">${esc(D.mito.frase)}</q></div>
        <div><div class="opts"><button class="m" data-myth="MITO">MITO</button><button data-myth="VERDADE">VERDADE</button></div><div class="ans" id="mythAns"></div></div></div>`;
    }
    if (!inner) return;
    h += `<section class="sec wrap${S.centro ? ' center' : ''}" id="${S.id}"><div class="sechead rv"><h3>${S.nome}</h3>${S.desc ? `<p>${S.desc}</p>` : ''}</div>${inner}</section>`;
  });

  // vídeo
  const V = D.video || {};
  if (V.src){
    const isFile = /^data:video|\.mp4($|\?)/i.test(V.src);
    const player = isFile ? `<video controls preload="metadata" playsinline src="${V.src}"></video>`
                          : `<a class="link" href="${esc(V.src)}" target="_blank" rel="noopener">▶ Assistir ao vídeo</a>`;
    h += `<section class="videosec" id="video"><div class="wrap grid"><div class="rv"><span class="tag">Aperte o play</span><h3>${esc(V.titulo)}</h3><p>${esc(V.descricao)}</p></div><div class="rv">${player}</div></div></section>`;
  }

  // quiz
  if ((D.quiz || []).length){
    h += `<section class="sec wrap" id="quiz"><div class="sechead rv"><h3>Desafio relâmpago</h3><p>${D.quiz.length} perguntas sobre esta edição. Quanto você leu de verdade?</p></div><div class="quiz rv" id="quizBox"></div></section>`;
  }

  // enquete
  const P = D.enquete || {};
  if (P.pergunta){
    h += `<section class="sec wrap" id="enquete"><div class="sechead rv"><h3>Enquete</h3><p>Sua opinião vale ouro (e é anônima).</p></div>
      <div class="poll rv"><h4>${esc(P.pergunta)}</h4><div id="pollOpts">${(P.opcoes || []).map((o, i) => `<button class="opt" data-p="${i}"><i></i><span><em style="font-style:normal">${esc(o)}</em><b class="pct"></b></span></button>`).join('')}</div>
      <small>${E.formsLink ? `Quer que seu voto conte de verdade? <a href="${esc(E.formsLink)}" target="_blank" rel="noopener"><b>Vote no Forms oficial</b></a>.` : 'Seu voto fica registrado apenas nesta tela.'}</small></div></section>`;
  }

  // rodapé
  h += `<footer><div class="wrap">
      <span class="msg">Mensagem do mês:</span>
      <blockquote>${esc(D.mensagem)}</blockquote>
      <div class="row">
        <p><b>Qual risco da sua rotina precisa se tornar visível?</b></p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${E.emailRedacao ? `<a class="btn" href="mailto:${esc(E.emailRedacao)}?subject=Pauta para o ${encodeURIComponent(E.nome || 'Chamado Aberto')}">✉ Enviar pauta</a>` : ''}
          <a class="btn ghost" style="color:#fff;border-color:#fff" href="#topo">↑ Voltar ao topo</a>
        </div>
      </div>
      <p style="color:#888;font-size:13px;margin-top:20px">${esc(E.nome)} · Edição nº ${esc(E.numero)} · ${esc(E.mes)}${E.proxima ? ' · Próxima edição: ' + esc(E.proxima) : ''}</p>
    </div></footer>`;
  h += `<div class="overlay" id="ov" role="dialog" aria-modal="true"></div>`;
  document.getElementById('app').innerHTML = h;

  // ---------- interações ----------
  const ov = document.getElementById('ov');
  const close = () => { ov.classList.remove('open'); ov.innerHTML = ''; clearTimeout(storyTimer); document.body.style.overflow = ''; };
  ov.addEventListener('click', e => { if (e.target === ov || e.target.classList.contains('x')) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  function openArticle(a){
    ov.innerHTML = `<div class="article"><button class="x" aria-label="Fechar">×</button>${a.foto ? `<img src="${a.foto}" alt="">` : ''}
      <div class="in">${a.etiqueta ? `<span class="tag ${tagClass(a.etiqueta)}">${esc(a.etiqueta)}</span>` : ''}<h2>${esc(a.titulo)}</h2>${a.excerto ? '' : `<p class="lf">${esc(a.linhaFina)}</p>`}${quote(a.citacao)}<div class="txt">${paras(a.texto)}</div></div></div>`;
    ov.classList.add('open'); document.body.style.overflow = 'hidden';
  }
  document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.open; openArticle(k === 'manchete' ? M : noticias[+k.slice(1)]);
  }));

  // stories
  let storyTimer, cur = 0; const ST = D.novatos || [], DUR = 6000;
  function showStory(i){
    if (i < 0) i = 0; if (i >= ST.length) return close();
    cur = i; const p = ST[i];
    ov.innerHTML = `<div class="storyview"><div class="prog">${ST.map((_, k) => `<i><b style="width:${k < i ? 100 : 0}%"></b></i>`).join('')}</div>
      <button class="x" aria-label="Fechar">×</button>
      <div class="ph" style="background-image:url('${p.foto || ''}')"></div>
      <div class="tx"><h4>${esc(p.nome)}</h4><div class="role">${esc(p.cargo)}</div>
      ${p.pergunta ? `<div class="qq">${esc(p.pergunta)}</div><div class="aa">“${esc(p.resposta)}”</div>` : ''}
      ${p.curiosidade ? `<div><b style="color:var(--gold)">Curiosidade:</b> ${esc(p.curiosidade)}</div>` : ''}</div>
      <button class="nav l" aria-label="Anterior"></button><button class="nav r" aria-label="Próximo"></button></div>`;
    ov.classList.add('open'); document.body.style.overflow = 'hidden';
    const bar = ov.querySelectorAll('.prog b')[i];
    requestAnimationFrame(() => { bar.style.transition = `width ${DUR}ms linear`; bar.style.width = '100%'; });
    ov.querySelector('.nav.l').onclick = () => { clearTimeout(storyTimer); showStory(cur - 1); };
    ov.querySelector('.nav.r').onclick = () => { clearTimeout(storyTimer); showStory(cur + 1); };
    clearTimeout(storyTimer); storyTimer = setTimeout(() => showStory(cur + 1), DUR);
  }
  document.querySelectorAll('[data-story]').forEach(b => b.addEventListener('click', () => showStory(+b.dataset.story)));

  // reações
  document.querySelectorAll('.reacts button').forEach(b => b.addEventListener('click', () => {
    const s = b.querySelector('span'); const on = b.classList.toggle('on');
    { const v = (+s.textContent || 0) + (on ? 1 : -1); s.textContent = v > 0 ? v : ''; } b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  }));

  // mito ou verdade
  document.querySelectorAll('[data-myth]').forEach(b => b.addEventListener('click', () => {
    const ok = b.dataset.myth === String(D.mito.resposta).toUpperCase(); const a = document.getElementById('mythAns');
    a.innerHTML = `<b style="color:${ok ? '#6EE7A0' : '#FF8A8A'}">${ok ? 'Acertou!' : 'Quase!'} É ${esc(String(D.mito.resposta).toUpperCase())}.</b><p style="margin-top:6px;color:#ddd">${esc(D.mito.explicacao)}</p>`;
    a.classList.remove('show'); void a.offsetWidth; a.classList.add('show');
  }));

  // quiz
  const Q = D.quiz || []; let qi = 0, score = 0;
  function quiz(){
    const box = document.getElementById('quizBox'); if (!box) return;
    if (qi >= Q.length){
      const pct = score / Q.length;
      const [t, d] = pct === 1 ? ['Referência em GRC 🏆', 'Leu tudo e conectou os principais temas.'] : pct >= .5 ? ['Boa visão do comunicado 💪', 'Mandou bem! Mais uma leitura e você domina a edição.'] : ['Hora de revisar 😅', 'Vale reler os destaques da edição.'];
      box.innerHTML = `<div class="res"><strong>${score}/${Q.length}</strong><h4>${t}</h4><p style="color:var(--muted);margin-bottom:18px">${d}</p><button class="btn" id="again">Jogar de novo</button></div>`;
      document.getElementById('again').onclick = () => { qi = 0; score = 0; quiz(); }; return;
    }
    const q = Q[qi], certa = (Number(q.certa) || 1) - 1;
    box.innerHTML = `<div class="bar"><i style="width:${qi / Q.length * 100}%"></i></div><small style="color:var(--muted);font-weight:700">PERGUNTA ${qi + 1} DE ${Q.length}</small>
      <div class="q">${esc(q.pergunta)}</div>${(q.opcoes || []).map((o, k) => `<button class="op" data-k="${k}">${String.fromCharCode(65 + k)}) ${esc(o)}</button>`).join('')}`;
    box.querySelectorAll('.op').forEach(b => b.onclick = () => {
      const k = +b.dataset.k; if (k === certa) score++;
      box.querySelectorAll('.op').forEach(x => { x.disabled = true; if (+x.dataset.k === certa) x.classList.add('right'); });
      if (k !== certa) b.classList.add('wrong');
      setTimeout(() => { qi++; quiz(); }, 1100);
    });
  }
  quiz();

  // enquete (voto só nesta tela, sem resultados inventados)
  document.querySelectorAll('#pollOpts .opt').forEach(b => b.addEventListener('click', () => {
    const me = +b.dataset.p;
    document.querySelectorAll('#pollOpts .opt').forEach((x, i) => {
      x.querySelector('i').style.width = i === me ? '100%' : '0'; x.querySelector('.pct').textContent = i === me ? '✔ Seu voto' : '';
      x.classList.toggle('mine', i === me); x.disabled = true;
    });
  }));

  // animação ao rolar + contadores
  const fmt = n => n.toLocaleString('pt-BR');
  const count = el => {
    const end = +el.dataset.count, pre = el.dataset.pre || '', suf = el.dataset.suf || '', t0 = performance.now(), dur = 1600;
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = pre + fmt(Math.round(end * e)) + suf; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return; e.target.classList.add('in');
      e.target.querySelectorAll('[data-count]').forEach(count); io.unobserve(e.target);
    }), {threshold: .15});
    document.querySelectorAll('.rv').forEach(el => io.observe(el));
  } else {
    document.querySelectorAll('.rv').forEach(el => el.classList.add('in'));
    document.querySelectorAll('[data-count]').forEach(count);
  }
})();
</script>
</body>
</html>
